<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unbound Soundtrack</title>
<link rel="icon" type="image/png" sizes="16x16" href="img/icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="img/icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="icon" type="image/png" sizes="256x256" href="img/icon-256.png">
<link rel="stylesheet" href="dialog.css">
<style>
:root {
  --acid: #b6ff1a; --acid-dim: #7fb30f; --sun: #ffe600; --ink: #0a0a0a; --paper: #f4f4f0; --mute: #8a8a85;
  --line: rgba(255,255,255,.14);
  --font: "Bahnschrift", "DIN Alternate", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
/* у Bahnschrift нет иероглифов: латиница — Bahnschrift, остальное — шрифт Windows для языка (lang="zh-Hans" / "ja" / "ko" ставит applyI18n) */
:lang(zh) { --font: "Bahnschrift", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
:lang(ja) { --font: "Bahnschrift", "Yu Gothic UI", "Meiryo UI", "Meiryo", sans-serif; }
:lang(ko) { --font: "Bahnschrift", "Malgun Gothic", sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0b0b0c; color: var(--paper); font-family: var(--font); overflow: hidden; }
body { font-variation-settings: "wdth" 85, "wght" 500; }

/* ---------- фон: слои как в меню гаража (картинки берутся из игры игрока при первом запуске) ---------- */
.bg, .bg > div { position: fixed; inset: 0; pointer-events: none; }
.bg { background: radial-gradient(ellipse at 72% 28%, rgba(120,170,20,.16) 0%, transparent 55%), radial-gradient(ellipse at 10% 90%, rgba(255,230,0,.06) 0%, transparent 50%), #0b0b0c; }  /* пока нет фонов из игры */
.bg .photo { background: var(--photo, none) center/cover; filter: saturate(.7) brightness(.5) contrast(1.1); transform: scale(1.06); animation: drift 40s ease-in-out infinite alternate; }
.bg .leak { background: var(--leak, none) center/cover; mix-blend-mode: screen; opacity: .22; }
.bg .shade { background: linear-gradient(90deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.45) 30%, rgba(0,0,0,.15) 100%); }
.bg .logo { background: var(--logo, none) no-repeat; background-size: 1500px auto; background-position: -120px 46%; opacity: .07; transform: rotate(-5deg); }
.bg .halftone { background: var(--halftone, none) repeat; background-size: 520px; opacity: .10; mix-blend-mode: screen; -webkit-mask-image: linear-gradient(115deg, #000 0%, transparent 55%); mask-image: linear-gradient(115deg, #000 0%, transparent 55%); }
.bg .dots { background: var(--dots, none) repeat; background-size: 640px; opacity: .20; }
.bg .grunge { background: var(--grunge, none) repeat; background-size: 900px; opacity: .10; mix-blend-mode: screen; }
.bg .noise { background: var(--noise, none) repeat; background-size: 1400px; opacity: .10; animation: grain .6s steps(3) infinite; }
.bg .vig { background: radial-gradient(ellipse at 60% 50%, transparent 40%, rgba(0,0,0,.75) 100%); }
@keyframes drift { from { transform: scale(1.06) translateX(0); } to { transform: scale(1.1) translateX(-30px); } }
@keyframes grain { 0% { background-position: 0 0; } 33% { background-position: -230px 120px; } 66% { background-position: 170px -90px; } }
@media (prefers-reduced-motion: reduce) { .bg .photo, .bg .noise { animation: none; } }

.ghost { position: fixed; top: 4vh; left: -2vw; font-size: 21vh; line-height: .82; font-weight: 700; font-variation-settings: "wdth" 75, "wght" 700;
  color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.10); text-transform: uppercase; white-space: nowrap; transform: skewX(-8deg); pointer-events: none; user-select: none; }
.ghost span { display: block; }
.ghost span:nth-child(2) { margin-left: 22vw; -webkit-text-stroke-color: rgba(255,255,255,.06); }

/* ---------- раскладка ---------- */
.app { position: relative; z-index: 2; display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
.side { padding: 34px 0 28px 38px; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
.tag { align-self: flex-start; background: var(--acid); color: var(--ink); padding: 6px 16px 5px; font-size: 15px; letter-spacing: .14em; font-variation-settings: "wdth" 100, "wght" 700;
  transform: skewX(-12deg) rotate(-3deg); box-shadow: 4px 4px 0 var(--sun); }
.tag b { display: inline-block; transform: skewX(12deg); }
.title { margin-top: 18px; font-size: 54px; line-height: .9; white-space: nowrap; text-transform: uppercase; font-variation-settings: "wdth" 75, "wght" 700; transform: skewX(-8deg); text-shadow: 3px 3px 0 rgba(0,0,0,.6); }
.title em { font-style: normal; color: var(--acid); }

.menu { margin-top: 30px; list-style: none; }
.menu li { position: relative; cursor: pointer; margin: 4px 0; }
.menu .item { display: inline-block; white-space: nowrap; font-size: 30px; text-transform: uppercase; letter-spacing: .02em; font-variation-settings: "wdth" 80, "wght" 700;
  padding: 4px 18px 2px 4px; transform: skewX(-10deg); color: #e9e9e4; text-shadow: 0 2px 8px rgba(0,0,0,.8); transition: color .12s; }
.menu li:hover .item { color: #fff; }
.menu .cnt { font-size: 15px; color: var(--mute); margin-left: 8px; font-variation-settings: "wdth" 100, "wght" 500; }
.menu .new { display: inline-block; vertical-align: top; margin: 2px 0 0 4px; transform: rotate(-6deg); background: var(--acid); color: var(--ink); font-size: 11px; padding: 2px 5px; letter-spacing: .08em; font-variation-settings: "wdth" 100, "wght" 700; }
.menu li.on .item { background: var(--paper); color: var(--ink); text-shadow: none; box-shadow: 6px 6px 0 rgba(0,0,0,.55); }
.menu li.on .cnt { color: #555; }
.menu .sub { display: none; margin: 2px 0 6px 10px; padding: 3px 10px; background: var(--paper); color: var(--ink); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; transform: skewX(-10deg); font-variation-settings: "wdth" 100, "wght" 600; width: max-content; max-width: 280px; }
.menu li.on .sub { display: block; }

.stats { margin-top: 28px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); line-height: 1.9; }
.stats b { color: var(--paper); font-size: 22px; font-variation-settings: "wdth" 80, "wght" 700; letter-spacing: 0; margin-right: 4px; }
.stats .bar { height: 4px; background: rgba(255,255,255,.12); margin: 2px 0 10px; width: 240px; transform: skewX(-20deg); }
.stats .bar i { display: block; height: 100%; background: var(--acid); transition: width .25s; }
.stats .bar.sun i { background: var(--sun); }

/* ---------- профили (левая колонка) ---------- */
.prof { margin-top: 26px; width: 270px; }
.prof-list { display: flex; flex-direction: column; gap: 6px; max-height: 168px; overflow-y: auto; padding: 2px 8px 4px 2px; }
.prof-list::-webkit-scrollbar { width: 4px; } .prof-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); }
.pf { display: flex; align-items: center; gap: 6px; padding: 6px 10px 5px; border: 1px solid var(--line); background: rgba(0,0,0,.5); cursor: pointer; transform: skewX(-10deg);
  font-size: 15px; letter-spacing: .06em; text-transform: uppercase; font-variation-settings: "wdth" 85, "wght" 700; color: #d8d8d2; }
.pf:hover { border-color: var(--paper); color: #fff; }
.pf .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pf.on { background: var(--acid); border-color: var(--acid); color: var(--ink); box-shadow: 4px 4px 0 var(--sun); cursor: default; }
.pf button { background: none; border: 0; color: inherit; font-size: 14px; cursor: pointer; padding: 0 3px; opacity: .65; }
.pf button:hover { opacity: 1; }
.pf-new { margin-top: 8px; background: none; border: 1px dashed rgba(182,255,26,.55); color: var(--acid); font: inherit; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  padding: 6px 12px; cursor: pointer; transform: skewX(-10deg); font-variation-settings: "wdth" 100, "wght" 700; }
.pf-new:hover { background: rgba(182,255,26,.1); }
/* ---------- разделы сетки ---------- */
.sep { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin: 6px 0 -4px; }
.sep b { font-size: 22px; line-height: 1; text-transform: uppercase; font-weight: normal; font-variation-settings: "wdth" 78, "wght" 700; transform: skewX(-10deg); letter-spacing: .02em; }
.sep i { font-style: normal; background: var(--acid); color: var(--ink); font-size: 12px; padding: 2px 7px; transform: skewX(-10deg); font-variation-settings: "wdth" 100, "wght" 700; }
.sep::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, rgba(182,255,26,.6), rgba(255,255,255,.06)); }
.sep.game i { background: var(--paper); }
.sep .mbtn { order: 3; font: inherit; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--line); color: var(--mute); background: rgba(0,0,0,.5); cursor: pointer; transform: skewX(-10deg); font-variation-settings: "wdth" 100, "wght" 700; }
.sep .mbtn:hover { color: var(--ink); background: var(--acid); border-color: var(--acid); }
.sep.game::after { background: linear-gradient(90deg, rgba(244,244,240,.4), rgba(255,255,255,.04)); }

/* ---------- авторы (низ левой колонки) ---------- */
.credits { margin-top: auto; padding-top: 24px; width: 270px; }
.cr-h { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); margin-bottom: 10px; font-variation-settings: "wdth" 100, "wght" 600; }
.cr { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--paper); padding: 7px 14px 7px 7px; margin-bottom: 10px;
  background: rgba(0,0,0,.55); border: 1px solid var(--line); transform: skewX(-10deg); transition: border-color .12s, transform .12s, box-shadow .12s; }
.cr:hover { border-color: var(--acid); transform: skewX(-10deg) translate(-2px,-2px); box-shadow: 5px 5px 0 rgba(182,255,26,.25); }
.cr .ic { flex: none; width: 46px; height: 46px; display: grid; place-items: center; }
.cr .ic svg { width: 38px; height: 38px; transform: skewX(10deg); }
.cr .ic.claude { background: #f0eee6; box-shadow: 3px 3px 0 #d97757; }
.cr .ic.cat { background: var(--acid); box-shadow: 3px 3px 0 var(--sun); }
.cr b { display: block; font-size: 21px; line-height: 1; text-transform: uppercase; font-weight: normal; font-variation-settings: "wdth" 78, "wght" 700; letter-spacing: .02em; }
.cr i { display: block; margin-top: 4px; font-style: normal; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); font-variation-settings: "wdth" 100, "wght" 600; }
.cr:hover i { color: var(--acid); }
.foot { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
.foot .brk { flex-basis: 100%; height: 0; margin: -7px 0; }   /* перенос строки внутри .foot */
.foot-l { display: inline-block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute);   /* как .frosty: тот же наклон и рамка — иначе съезжает */
  transform: skewX(-10deg); font-variation-settings: "wdth" 100, "wght" 600; border-bottom: 1px solid transparent;
  flex-basis: 100%; margin-bottom: -8px; }   /* подпись своей строкой над ссылками: в одну строку с YouTube не влезает в 340px */
.frosty { display: inline-block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); text-decoration: none; cursor: pointer; background: none; border: 0; font-family: inherit;
  transform: skewX(-10deg); font-variation-settings: "wdth" 100, "wght" 600; border-bottom: 1px solid transparent; }
.frosty b { color: var(--paper); font-weight: normal; font-variation-settings: "wdth" 100, "wght" 700; }
.frosty:hover { color: var(--acid); border-bottom-color: var(--acid); }

/* ---------- правая часть ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; padding: 44px 34px 0 10px; }
.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.search { flex: 0 1 360px; position: relative; transform: skewX(-10deg); }
.search input { width: 100%; background: rgba(0,0,0,.55); border: 1px solid var(--line); color: var(--paper); font: inherit; font-size: 16px; padding: 10px 14px; outline: none; letter-spacing: .04em; }
.search input:focus { border-color: var(--acid); }
.btn { background: rgba(0,0,0,.55); border: 1px solid var(--line); color: var(--paper); font: inherit; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  padding: 11px 16px; cursor: pointer; transform: skewX(-10deg); font-variation-settings: "wdth" 100, "wght" 600; }
.btn:hover { border-color: var(--paper); }
.btn.go { margin-left: auto; background: var(--acid); color: var(--ink); border-color: var(--acid); font-size: 16px; padding: 12px 26px; box-shadow: 5px 5px 0 var(--sun); }
.btn.go:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .45; cursor: default; }

.legend { margin: 14px 0 0; font-size: 12px; color: var(--mute); letter-spacing: .08em; max-width: 1100px; line-height: 1.45; }
.legend b { color: var(--paper); font-weight: normal; }
/* окно «Як це працює» */
.help h3 { margin: 16px 0 4px; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--acid); font-weight: normal; font-variation-settings: "wdth" 100, "wght" 700; }
.help h3:first-child { margin-top: 0; }
.help p, .help li { line-height: 1.5; }
.help ul, .help ol { margin: 4px 0; padding-left: 20px; }
.help b { color: var(--paper); }

.grid { flex: 1; min-height: 0; overflow-y: auto; margin-top: 14px; padding: 6px 12px 120px 6px; display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 18px; align-content: start; }
.grid::-webkit-scrollbar { width: 8px; } .grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); }

.card { position: relative; background: rgba(8,8,8,.72); border: 1px solid var(--line); cursor: pointer; transition: transform .14s, border-color .14s, opacity .2s, filter .2s; }
.card:hover { transform: translate(-3px,-3px); border-color: var(--acid); box-shadow: 6px 6px 0 rgba(182,255,26,.25); }
.card .art { position: relative; aspect-ratio: 1; overflow: hidden; background: #141518; }
.card .art img { width: 100%; height: 100%; display: block; object-fit: cover; transition: filter .2s; }
.card .art::after { content: ""; position: absolute; inset: 0; background: var(--dots, none) repeat; background-size: 300px; opacity: .25; mix-blend-mode: overlay; pointer-events: none; }
.card .art .noart { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; text-align: center; font-size: 22px; line-height: 1; text-transform: uppercase; color: rgba(255,255,255,.3); font-variation-settings: "wdth" 75, "wght" 700; }
.card .meta { padding: 9px 10px 8px; }
.card .t { font-size: 17px; line-height: 1.05; text-transform: uppercase; font-variation-settings: "wdth" 78, "wght" 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .a { margin-top: 3px; font-size: 12px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 14px; }
.card .sw { display: flex; gap: 6px; padding: 0 10px 10px; }
.pill { flex: 1; text-align: center; font-size: 11px; letter-spacing: .12em; padding: 5px 0 4px; border: 1px solid rgba(255,255,255,.25); color: var(--mute);
  transform: skewX(-12deg); font-variation-settings: "wdth" 100, "wght" 700; user-select: none; cursor: pointer; }
.pill.on { background: var(--acid); border-color: var(--acid); color: var(--ink); }
.pill.f.on { background: var(--sun); border-color: var(--sun); }
.pill:hover { border-color: var(--paper); }
.card.off { opacity: .45; }
.card.off .art img { filter: grayscale(1) brightness(.6); }
.card.off .art::before { content: attr(data-off); position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-12deg); font-size: 34px; letter-spacing: .1em;
  color: var(--ink); background: var(--paper); padding: 2px 14px; font-variation-settings: "wdth" 75, "wght" 700; }
.card.half .art::before { content: ""; position: absolute; z-index: 2; right: 8px; top: 8px; width: 12px; height: 12px; background: var(--sun); transform: rotate(45deg); }
.pv { position: absolute; z-index: 3; left: 8px; bottom: 8px; width: 42px; height: 42px; border: none; background: var(--acid); color: var(--ink); font-size: 16px; font-weight: 700;
  cursor: pointer; transform: skewX(-10deg); box-shadow: 3px 3px 0 rgba(0,0,0,.6); opacity: 0; transition: opacity .15s; }
.card:hover .pv, .pv.on { opacity: 1; }
.pv.on { background: var(--sun); }
.card .pbar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 3px; pointer-events: none; }
.card .pbar i { display: block; height: 100%; width: 0; background: var(--sun); }
.ed { position: absolute; z-index: 3; right: 8px; top: 8px; width: 34px; height: 34px; display: grid; place-items: center; border: none; background: var(--paper); color: var(--ink); cursor: pointer; transform: skewX(-10deg); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.ed:hover { background: var(--acid); }
.yt { position: absolute; z-index: 3; right: 8px; bottom: 8px; height: 30px; padding: 0 9px; border: none; background: var(--paper); color: var(--ink); font: inherit; font-size: 12px; letter-spacing: .08em;
  cursor: pointer; transform: skewX(-10deg); box-shadow: 3px 3px 0 rgba(0,0,0,.6); opacity: 0; transition: opacity .15s; font-variation-settings: "wdth" 100, "wght" 700; }
.card:hover .yt { opacity: 1; }
.yt:hover { background: #ff3b3b; color: #fff; }
.mine-tag { position: absolute; z-index: 3; left: 8px; top: 8px; background: var(--acid); color: var(--ink); font-size: 11px; letter-spacing: .14em; padding: 3px 8px 2px;
  transform: skewX(-10deg) rotate(-4deg); box-shadow: 3px 3px 0 var(--sun); font-variation-settings: "wdth" 100, "wght" 700; }
.card.mine { border-color: rgba(182,255,26,.55); }
.card.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 260px; border: 2px dashed rgba(182,255,26,.5); background: rgba(8,8,8,.5); text-align: center; padding: 16px; }
.card.add .plus { font-size: 64px; line-height: 1; color: var(--acid); font-variation-settings: "wdth" 75, "wght" 700; }
.card.add b { font-size: 22px; text-transform: uppercase; font-weight: normal; font-variation-settings: "wdth" 78, "wght" 700; }
.card.add span { font-size: 12px; color: var(--mute); letter-spacing: .08em; }
.card.add.dragto, .card.add:hover { border-color: var(--acid); background: rgba(182,255,26,.07); }
.card.add.ytadd .plus { font-size: 46px; padding: 9px 0; }
/* приоритет трека в игре: HIGH (по умолчанию) / LOW — играет редко */
/* HIGH — залитый красный (часто), LOW — тот же красный контуром (приглушен, редко) */
.pill.pr { flex: 0 0 auto; min-width: 46px; padding-left: 6px; padding-right: 6px; background: #ff3b3b; color: var(--ink); border-color: #ff3b3b; }
.pill.pr.low { background: transparent; color: #ff3b3b; border-color: rgba(255,59,59,.75); }
.pill.pr:hover { border-color: var(--paper); }
/* сортировка / фильтры / вид */
.vbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.vbar select { background: rgba(0,0,0,.55); border: 1px solid var(--line); color: var(--paper); font: inherit; font-size: 12px; letter-spacing: .06em; padding: 7px 10px; cursor: pointer; max-width: 280px; }
.vbar select:hover, .vbar select:focus { border-color: var(--acid); outline: none; }
.vbar option { background: #141518; color: var(--paper); }
.vbar .vt { display: flex; gap: 4px; margin-left: auto; }
.vbar .vt button { width: 36px; height: 32px; display: grid; place-items: center; background: rgba(0,0,0,.55); border: 1px solid var(--line); color: var(--mute); cursor: pointer; }
.vbar .vt button:hover { color: var(--paper); border-color: var(--paper); }
.vbar .vt button.on { background: var(--acid); border-color: var(--acid); color: var(--ink); }
.vbar .vt svg { width: 16px; height: 16px; fill: currentColor; }
/* вид списком: та же карточка строкой */
.grid.list { grid-template-columns: 1fr; gap: 6px; }
.grid.list .card { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; column-gap: 14px; padding-right: 10px; }
.grid.list .card:hover { transform: translate(-2px, -2px); }
.grid.list .card .art { width: 52px; height: 52px; aspect-ratio: auto; }
.grid.list .card .art .noart { font-size: 9px; padding: 3px; }
.grid.list .card .meta { padding: 6px 0; display: flex; align-items: baseline; gap: 16px; min-width: 0; }
.grid.list .card .t { font-size: 16px; flex: 0 1 auto; min-width: 0; }
.grid.list .card .a { margin-top: 0; flex: 1 1 auto; min-width: 0; }
.grid.list .card .sw { padding: 0; }
.grid.list .card .sw .pill { flex: 0 0 auto; min-width: 88px; }
.grid.list .card .sw .pill.pr { min-width: 52px; }
.grid.list .mine-tag, .grid.list .yt, .grid.list .pbar, .grid.list .card.off .art::before, .grid.list .card.half .art::before { display: none; }
.grid.list .ed { width: 26px; height: 26px; right: 13px; top: 13px; opacity: 0; }
.grid.list .card:hover .ed { opacity: 1; }
.grid.list .pv { width: 32px; height: 32px; left: 10px; bottom: 10px; font-size: 12px; }
.grid.list .card.add { display: flex; min-height: 54px; flex-direction: row; justify-content: flex-start; gap: 14px; padding: 8px 16px; }
.grid.list .card.add .plus { font-size: 30px; }

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// старт гонки: катсцена + 3 с отсчета 3-2-1, на GO — дроп (12.11: 17+3 — при 17 дроп бил на «3»; 13.11: 21+3 и 17+4 не то; 17 + 3,65 = 20,65 (замер по трекам игры) тоже мимо → 17 + 3,45 = 20,45)
const B_CUT = 17, B_COUNT = 3.45, B_INTRO = B_CUT + B_COUNT, C_DUR = 25, SR = 48000;   // те же числа — src/Audio.cs (13.11: 20,45 — Ваня после теста 20,65)
const AUDIO_EXT = [".mp3", ".wav", ".flac", ".ogg", ".oga", ".opus", ".m4a", ".aac"];
let S = null, tracks = [], songs = [], filter = "all";

// ---------- связь с программой ----------
async function api(path, body, raw) {
  let r;
  try {
    r = await fetch(path, body === undefined ? {} : { method: "POST", body: raw ? body : JSON.stringify(body) });
  } catch (e) { throw { key: "net" }; }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (j && j.error) throw { key: j.error, arg: j.errorArg };
  if (!r.ok) throw { key: "crash", arg: "HTTP " + r.status };
  return j;
}
const errText = e => t("err_" + (e && e.key || "crash"), { a: e && e.arg || "" }) + (e && e.arg && !/\{a\}/.test(I18N.en["err_" + e.key] || "") && e.key === "crash" ? " (" + e.arg + ")" : "");
async function showError(e) {
  const v = await askYesNo({ title: t("failT"), html: `<p>${esc(errText(e))}</p><p><small>${t("bugHint", { url: "https://forms.gle/StNa4GFZRHckFVpi8" })}</small></p>`, yes: t("close"), no: t("openLog") });
  if (!v) api("/api/open", { what: "log" }).catch(() => {});
}
function note(html) { const n = $("note"); n.innerHTML = html; n.classList.add("show"); clearTimeout(note.t); note.t = setTimeout(() => n.classList.remove("show"), 5000); }

// ссылки — в обычном браузере, не в окне программы
document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='http']");
  if (!a) return;
  e.preventDefault(); openUrl(a.href);
});
// ссылка — в браузере по умолчанию через программу; программа не ответила — открываем сами
const openUrl = u => api("/api/url", { url: u }).catch(() => window.open(u, "_blank", "noopener"));
// ключ шифрования игры для Frosty Mod Manager (Nexus) — в окнах Frosty / ключа / выбора папки Mod Manager ({keyLink} в текстах)
const KEY_LINK = '<a href="https://www.nexusmods.com/needforspeedunbound/mods/97?tab=description">NFS Unbound Encryption Key ↗</a>';

// ---------- старт: язык → соглашение → игра → Mod Manager → подготовка ----------
async function boot() {
  try { S = await api("/api/state"); } catch (e) { await showError(e); return; }
  if (I18N[S.lang]) setLang(S.lang);
  else {   // первый запуск: язык Windows (если он есть среди наших, иначе English) — сверху крупно, остальные — сеткой;
           // заголовок, подсказка и строка «переводы сделаны ИИ» — на том языке, на котором стоит выбор (мышь / стрелки)
    const win = LANG, codes = [win, ...LANGS.map(([c]) => c).filter(c => c !== win)];
    const L = (c, k) => (I18N[c] && I18N[c][k]) || I18N.en[k];
    const v = await askYesNo({ title: L(win, "langT"), cls: "dlg-lang", html: `<p data-lp>${L(win, "langPick")}</p>`,
      buttons: codes.map((c, i) => ({ label: i ? LANG_NAMES[c] : LANG_NAMES[c] + " — " + L(c, "langGo"), val: c })),
      onOpen: box => {
        const back = box.closest(".dlg-back"), note = document.createElement("p");
        note.className = "lang-ai"; note.textContent = L(win, "aiNote");
        back.querySelector(".dlg-btns").after(note);
        back.querySelectorAll(".dlg-btn").forEach((b, i) => {
          b.lang = hl(codes[i]);
          const show = () => {
            back.querySelector(".dlg-title").textContent = L(codes[i], "langT");
            box.querySelector("[data-lp]").textContent = L(codes[i], "langPick"); note.textContent = L(codes[i], "aiNote");
            back.querySelector(".dlg").lang = hl(codes[i]);
          };
          b.addEventListener("focus", show); b.addEventListener("mouseenter", show);   // стрелки / Tab — focus, мышь — mouseenter
        });
      } });
    setLang(I18N[v] ? v : LANG);
    await api("/api/lang", { lang: LANG }).catch(() => {});
  }
  if (S.view) { if (S.view.sort) vs.sort = S.view.sort; if (S.view.view) vs.view = S.view.view; }   // вид и сортировка — из settings.json (P2-07)
  document.body.classList.add("booting");   // язык в шапке — поверх первых окон (R1-05); show() убирает
  if (!S.agreed) {
    if (!await ask(() => ({ title: t("agreeT"), html: t("agreeHtml"), yes: t("agreeYes"), no: t("agreeNo") }))) return quit();
    await api("/api/agree", {});
  }
  while (!S.game) {
    if (!await ask(() => ({ title: t("gameT"), html: t("gameHtml"), yes: t("pickFolder"), no: t("exit") }))) return quit();
    await pick("game");
  }
  while (!S.fmm || !S.key) {
    if (!S.fmm) {
      const v = await ask(() => ({ title: t("fmmT"), html: t("fmmHtml", { keyLink: KEY_LINK }) + `<p><small>${t("fmmFile")}</small></p>`, yes: t("pickFolder"), no: t("download") }));
      if (v) await pick("fmm"); else openUrl("https://github.com/HarGabt/FrostyToolsuite/releases");
    } else {
      const v = await ask(() => ({ title: t("keyT"), html: t("keyHtml", { keyLink: KEY_LINK }), yes: t("retry"), no: t("openFmm") }));
      if (!v) await api("/api/open", { what: "fmm" }).catch(showError);   // R1-03: не запустился — сказать
      S = await api("/api/search", {});
    }
  }
  if (!S.pathsOk) { if (!await confirmPaths()) return; }
  if (S.stale) { const ok = await runJob("/api/prepare", S.ready ? "prepT" : "prepT", !S.ready); if (!ok && !S.ready) return; S = await api("/api/state"); }
  show();
  if (!S.musicTold) { await musicInfo(); api("/api/music/told", {}).catch(() => {}); }
  booted = true; syncMusic();
}
// окно «Пісні з папки»: как класть песни в Music (после первой подготовки и по кнопке «?»)
async function musicInfo() {
  if (await askYesNo({ title: t("musicT"), html: t("musicHtml", { mine: t("secMine"), add: t("addSong") }), yes: t("musicOk"), no: t("musicOpen"), tall: true }) === false)
    api("/api/open", { what: "music" }).catch(() => {});
}
// окно, которое переводится на лету: f() строит {title, html, yes, no} через t(); язык сменили на первых экранах — dialog.js зовет f() снова (R1-05)
const ask = f => askYesNo(Object.assign(f(), { re: f }));
// выбор папки прямо в окне программы (системное окно выбора открывалось позади окна программы)
async function pick(what) {
  let cur = "", valid = false, reload = null;
  const isGame = what === "game";
  const hint = () => t(isGame ? "pickGameHint" : "pickFmmHint", { keyLink: KEY_LINK });
  const ok = await askYesNo({
    title: t(isGame ? "gameT" : "fmmT"), yes: t("pickThis"), no: t("cancel"),
    re: () => ({ title: t(isGame ? "gameT" : "fmmT"), yes: t("pickThis"), no: t("cancel") }),
    onRelang: back => { back.querySelector("[data-hint]").innerHTML = hint(); if (reload) reload(); },
    html: `<p data-hint>${hint()}</p>
      <div class="fp-path"><button data-up title="..">↑</button><input data-in spellcheck="false"><button data-go>→</button></div>
      <div class="fp-list" data-list></div><div class="fp-st" data-st></div>`,
    onOpen: (box, done) => {
      const inp = box.querySelector("[data-in]"), list = box.querySelector("[data-list]"), st = box.querySelector("[data-st]");
      let parent = null;
      const load = async path => {
        let r; try { r = await api("/api/dirs", { path }); } catch (e) { st.textContent = errText(e); return; }
        cur = r.path; parent = r.parent; inp.value = r.missing || r.path;   // R1-02: путь, которого нет, не стираем
        valid = !!(isGame ? r.game : r.fmm);
        st.className = "fp-st " + (valid ? "ok" : "no");
        st.textContent = r.missing ? t("fpNone") : !r.path ? t("fpPlaces") : valid ? t(isGame ? "fpOkGame" : "fpOkFmm") : (r.denied ? t("fpDenied") : t("fpNo"));
        list.innerHTML = "";
        for (const d of r.dirs) {
          const b = document.createElement("button"), hit = isGame ? d.game : d.fmm;
          b.textContent = (hit ? "✓ " : "") + (d.kind ? t("place_" + d.kind) : d.name); b.title = d.path; if (hit) b.className = "hit";   // R1-07
          b.onclick = () => load(d.path);
          list.appendChild(b);
        }
      };
      reload = () => load(inp.value);
      box.querySelector("[data-up]").onclick = () => load(parent || "");
      box.querySelector("[data-go]").onclick = () => load(inp.value);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); load(inp.value); } });
      const start = isGame ? S.game : S.fmm;
      load(start || "");
    }
  });
  if (!ok) return;
  if (!valid) { await askYesNo({ title: t(isGame ? "gameT" : "fmmT"), html: `<p>${t(isGame ? "notGame" : "notFmm")}</p><p><code>${esc(cur || "—")}</code></p>`, yes: "OK", no: null }); return pick(what); }
  try {
    const r = await api("/api/pick", { what, path: cur });
    if (r && r.error) { await askYesNo({ title: t(isGame ? "gameT" : "fmmT"), html: `<p>${t(r.error)}</p><p><code>${esc(r.errorArg)}</code></p>`, yes: "OK", no: null }); return; }
    if (r && !r.cancel) S = r;
  } catch (e) { await showError(e); }
}
// папки игры и Mod Manager: показать, подтвердить или поменять
async function confirmPaths() {
  while (true) {
    const ok = await ask(() => ({ title: t("whereT"), html: t("whereHtml", { g: esc(S.game || "—"), f: esc(S.fmm || "—") }), yes: t("whereYes"), no: t("whereNo") }));
    if (ok && S.game && S.fmm && S.key) { await api("/api/pathsok", {}); S.pathsOk = true; return true; }
    if (!ok) {
      const g = await ask(() => ({ title: t("changeT"), html: t("changeHtml"), yes: t("changeGame"), no: t("changeFmm") }));
      await pick(g ? "game" : "fmm");
    }
    if (!S.key && S.fmm) { boot(); return false; }   // новый Mod Manager без ключа — пусть boot покажет подсказку
  }
}
async function changeFolders() {
  const before = S.game;
  if (!await askYesNo({ title: t("whereT"), html: t("whereHtml", { g: esc(S.game || "—"), f: esc(S.fmm || "—") }).replace(/<p>[^<]*[?？]<\/p>$/, ""), yes: t("close"), no: t("whereNo") })) {
    const g = await askYesNo({ title: t("changeT"), html: t("changeHtml"), yes: t("changeGame"), no: t("changeFmm") });
    await pick(g ? "game" : "fmm");
    S = await api("/api/state").catch(() => S);
    if (S.game !== before || S.stale) boot(); else show();
  }
}
function quit() { api("/api/quit", {}).catch(() => {}); setTimeout(() => window.close(), 150); }

// задание программы (подготовка / сборка) с полосой прогресса; true — успех
async function runJob(path, titleKey, first) {
  let j, stopping = false, asking = false;
  try { j = await api(path, {}); } catch (e) { await showError(e); return false; }
  // сборку можно остановить (Ваня 13.11): «Стоп» / Esc -> «Зупинити?» (по умолчанию «Продовжити») -> программа гасит рабочий процесс; мод в Mods не тронут
  const stop = path === "/api/build" ? { label: t("ytStop"), fn: async () => {
    if (asking || stopping) return;
    asking = true;
    const ok = await askYesNo({ title: t("buildStopT"), html: t("buildStopHtml"), yes: t("ytStop"), no: t("buildGoOn"), start: 1 });
    asking = false;
    if (!ok || stopping) return;
    stopping = true; updateBusy(t("buildStopping"), -1);
    api("/api/job/stop", {}).catch(() => {});
  } } : null;
  showBusy(t(titleKey), first ? t("prepFirst") : "", stop);
  while (!j.done) {
    await new Promise(r => setTimeout(r, 400));
    try { j = await api("/api/job"); } catch (e) {
      // ошибка задания приходит броском из api() ({key: job.error}), а не в j — свои случаи разбираем здесь (13.11: «Стоп» показывал err_stopped)
      hideBusy();
      if (e && e.key === "stopped") { note(t("buildStopped")); return false; }
      if (e && e.key === "vcMissing") return (await vcMissing()) ? runJob(path, titleKey, first) : false;
      await showError(e); return false;
    }
    if (!j) break;
    const [key, ...rest] = (j.step || "").split(" ");
    if (key && !stopping) updateBusy(t("step_" + key, { a: rest.join(" ") }), j.pct);
  }
  hideBusy();
  if (j && j.error === "stopped") { note(t("buildStopped")); return false; }
  if (j && j.error === "vcMissing") return (await vcMissing()) ? runJob(path, titleKey, first) : false;
  if (j && j.error) { await showError({ key: j.error, arg: j.errorArg }); return false; }
  runJob.result = j && j.result;
  return true;
}
// P2-01: Frosty не загрузился — нет Microsoft Visual C++ (обычно хватает своей копии в app\frosty; это запасной путь).
// Установщик Microsoft лежит в app\vcredist; true — поставили, повторить
async function vcMissing() {
  if (!await askYesNo({ title: t("vcT"), html: t("vcHtml"), yes: t("vcInstall"), no: t("close") })) return false;
  await api("/api/open", { what: "vcredist" }).catch(showError);
  return await askYesNo({ title: t("vcT"), html: t("vcAfter"), yes: t("retry"), no: t("close") });
}

// ---------- главное окно ----------
function show() {
  document.body.classList.remove("booting");
  const bg = $("bg").style, root = document.documentElement.style;
  for (const [k, v] of Object.entries(S.bg || {})) { bg.setProperty("--" + k, `url("${v}")`); root.setProperty("--" + k, `url("${v}")`); }
  tracks = S.tracks; songs = S.songs;
  renderProfiles(); render(); stats();
}

// ---------- вид, сортировка, фильтры (Ваня 12.11); запоминает программа (settings.json, P2-07) — localStorage окна каждый запуск новый ----------
const vs = { sort: "order", art: "", where: "", view: "tiles" };
// помним вид и сортировку; фильтры (исполнитель, «где играет») — нет: после перезапуска все песни видны
const saveVs = () => api("/api/view", { sort: vs.sort, view: vs.view }).catch(() => {});
// «A & B, C feat. D» -> [A, B, C, D]
const splitArt = a => String(a || "").split(/\s*(?:,|&|\bx\b|\bfeat\.?|\bft\.?|\bwith\b)\s*/i).map(s => s.trim()).filter(Boolean);
const isLow = x => x.mine ? !!x.low : !!(x.on && x.on[2]);
let orderOk = false;   // можно ли таскать свои песни: «мой порядок», без фильтров и поиска
function fillBars() {
  const opt = (v, txt, cur) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(txt)}</option>`;
  $("sortSel").innerHTML = [["order", "sortOrder"], ["artist", "sortArtist"], ["title", "sortTitle"], ["new", "sortNew"]].map(([v, k]) => opt(v, t(k), vs.sort)).join("");
  const cnt = new Map();   // ключ — без регистра, имя — как встретилось первым
  for (const x of (songs || []).concat(tracks || [])) for (const a of splitArt(x.artist)) { const k = a.toLowerCase(), c = cnt.get(k); if (c) c.n++; else cnt.set(k, { name: a, n: 1 }); }
  if (vs.art && !cnt.has(vs.art)) vs.art = "";
  const arts = [...cnt.entries()].sort((a, b) => a[1].name.localeCompare(b[1].name));
  $("artSel").innerHTML = opt("", t("artAll"), vs.art) + arts.map(([k, c]) => opt(k, c.name + " · " + c.n, vs.art)).join("");
  $("whereSel").innerHTML = [["", "whereAll"], ["race", "whereRace"], ["city", "whereCity"], ["low", "whereLow"]].map(([v, k]) => opt(v, t(k), vs.where)).join("");
  $("vTiles").classList.toggle("on", vs.view !== "list"); $("vList").classList.toggle("on", vs.view === "list");
  $("grid").classList.toggle("list", vs.view === "list");
}

function visible() {
  const q = $("q").value.trim().toLowerCase();
  const m = x => !q || (x.title + " " + x.artist + " " + (x.slot || "")).toLowerCase().includes(q);
  const onOf = x => x.mine ? [x.race, x.city] : x.on;
  const all = songs.map(s => Object.assign(s, { mine: true })).concat(tracks);
  return all.filter(x => {
    if (!m(x)) return false;
    const o = onOf(x);
    if (vs.art && !splitArt(x.artist).some(a => a.toLowerCase() === vs.art)) return false;
    if (vs.where === "race" && !o[0]) return false;
    if (vs.where === "city" && !o[1]) return false;
    if (vs.where === "low" && !isLow(x)) return false;
    if (filter === "mine") return x.mine;
    if (filter === "on") return o[0] || o[1];
    if (filter === "off") return !o[0] && !o[1];
    return true;
  });
}
const onOf = x => x.mine ? [x.race, x.city] : x.on;
function cardClass(x) { const o = onOf(x); return "card" + (!o[0] && !o[1] ? " off" : (o[0] !== o[1] ? " half" : "")) + (x.mine ? " mine" : ""); }

function card(x) {
  const o = onOf(x), key = x.mine ? "s:" + x.id : "t:" + x.slot;
  const art = x.cover ? `<img src="${esc(x.cover)}" loading="lazy" alt="">` : `<div class="noart"${dataLang()}>${esc(x.title)}</div>`;

const dropSide = (c, e) => { const r = c.getBoundingClientRect(); return vs.view === "list" ? e.clientY > r.top + r.height / 2 : e.clientX > r.left + r.width / 2; };
$("grid").addEventListener("dragstart", e => {

$("grid").addEventListener("drop", async e => {

async function dropAny(e) {
  if (rp.open || document.querySelector(".dlg-back.show")) return;
  const all = [...(e.dataTransfer.files || [])];
  const files = all.filter(f => AUDIO_EXT.includes((f.name.match(/\.[^.]+$/) || [""])[0].toLowerCase()) || (f.type || "").startsWith("audio/"));
  if (files.length === 1) { openSong(null, files[0]); return; }
  if (files.length > 1) { addFiles(files); return; }
  const txt = all.find(f => /\.(txt|csv|tsv)$/i.test(f.name));
  if (txt) { ytAsk(await readTxt(txt)); return; }
  const u = e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain") || "";
  if ((u.match(YT_RE) || []).some(isYt)) ytAsk(u);
}
// несколько файлов: как импорт из папки Music — имена из тегов / имени файла, GO и финиш сами, обложка нарисована, файл — в Music\<номер>\
async function addFiles(list) {
  if (playing) stopPreview();
  showBusy(t("musicImpT"), "");
  let added = 0; const bad = [];
  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    updateBusy(t("musicStep", { n: i + 1, m: list.length, a: f.name }), 100 * i / list.length);
    try {
      const buf = await f.arrayBuffer(), tg = id3(buf), a = await decode(buf);
      let [artist, title] = parseName(f.name);
      if (tg.title) { artist = tg.artist || ""; title = tg.title; }
      const cDur = C_DUR, drop = guessDrop(a), outro = Math.max(0, a.duration - cDur);
      const res = await api("/api/song/upload?name=" + encodeURIComponent(f.name), toPcm(a).buffer, true);
      await api("/api/song/cover?id=" + encodeURIComponent(res.id), await coverPng(null, title, artist), true);
      await api("/api/song/save", { id: res.id, title, artist, drop: +drop.toFixed(2), outro: +outro.toFixed(2), cDur, race: true, city: true });
      await api("/api/music/put?id=" + encodeURIComponent(res.id) + "&name=" + encodeURIComponent(f.name), f, true);
      added++;
    } catch (er) { bad.push(f.name); }
  }
  hideBusy();
  try { S = await api("/api/state"); tracks = S.tracks; songs = S.songs; render(); stats(); } catch (er) {}
  const msg = [];
  if (added) msg.push(t("musicAdded", { n: added, build: t("build") }));
  if (bad.length) msg.push(esc(t("musicFail", { a: bad.join(", ") })));
  if (msg.length) note(msg.join("<br>"));
}

// Окно целиком на экране — это просто 100% высоты. Пересчет при изменении размера.
function fitThanks(back) {
  const fit = () => {
    if (!back.isConnected) { removeEventListener("resize", fit); return; }
    const top = window.screenY + Math.max(0, window.outerHeight - window.innerHeight);   // верх содержимого окна на экране
    const a = screen.availTop || 0, b = a + screen.availHeight;
    const vt = Math.max(0, Math.min(innerHeight - 300, a - top)), vb = Math.min(innerHeight, Math.max(vt + 300, b - top));
    back.style.setProperty("--vis-top", vt + "px"); back.style.setProperty("--vis-h", (vb - vt) + "px");
  };
  fit(); addEventListener("resize", fit);
}

// ---------- своя песня: окно «гонка» (волна, GO, финиш), обложка ----------
const rp = { open: false, song: null, id: null, file: "", fileObj: null, dur: 0, drop: 0, outro: 0, cDur: C_DUR, peaks: null, audio: null, img: null, imgChanged: false, race: true, city: true };
const fmt = s => { s = Math.max(0, s || 0); return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); };

function openSong(song, file) {
  stopPanel(); if (playing) stopPreview();
  Object.assign(rp, { open: true, song, id: song ? song.id : null, file: song ? song.file : "", fileObj: null, dur: song ? song.dur : 0, drop: song ? song.drop : 0,
    outro: song ? song.outro : 0, cDur: song ? song.cDur || C_DUR : C_DUR, peaks: null, audio: song ? song.audio : null, img: null, imgChanged: false, covMode: song && song.cover ? "img" : "gen",

  $("rpDel").style.display = song ? "" : "none";
  pillsRp(); showBody(); wvMsg("");
  rp.snap = rpSnap();   // что было при открытии — закрытие сверяет: поменяли → «Вийти без збереження?»

  else if (song) {

  }
}
function closeSong() { stopPanel(); rp.open = false; $("rpan").classList.remove("show"); $("rpDim").classList.remove("show"); }
// всё, что сохраняет кнопка «Зберегти»: имя, звук (id/файл), GO, финиш, где играет, обложка
const rpSnap = () => JSON.stringify([$("rpArtist").value, $("rpTitle").value, rp.id, rp.file, +(rp.drop || 0).toFixed(2), +(rp.outro || 0).toFixed(2), rp.cDur, rp.race, rp.city, rp.covMode, rp.imgChanged]);

function pillsRp() { $("rpRace").classList.toggle("on", rp.race); $("rpCity").classList.toggle("on", rp.city); }
$("rpRace").onclick = () => { rp.race = !rp.race; pillsRp(); };
$("rpCity").onclick = () => { rp.city = !rp.city; pillsRp(); };
function showBody() {

const wvMsg = s => $("wvMsg").textContent = s;

// декодирование сразу в 48 кГц (так нужно игре)
async function decode(buf) { const ctx = new OfflineAudioContext(2, 1, SR); return await ctx.decodeAudioData(buf); }

function parseName(n, noExt) {
  n = (noExt ? n : n.replace(/\.[^.]+$/, "")).replace(/_/g, " ").replace(/\s*\((official|lyric|audio|music)[^)]*\)/ig, "").replace(/^\s*\d{1,3}\s*[.\-)]\s*/, "").trim();
  const m = n.split(/\s+[-–—]\s+/);
  return m.length > 1 ? [m[0].trim(), m.slice(1).join(" - ").trim()] : ["", n];
}

async function takeFile(f) {
  const ext = (f.name.match(/\.[^.]+$/) || [""])[0].toLowerCase();
  if (!AUDIO_EXT.includes(ext) && !(f.type || "").startsWith("audio/")) { note(esc(t("badFile")) + ": " + esc(f.name)); return; }
  stopPanel();
  Object.assign(rp, { audio: null, file: f.name, fileObj: f, dur: 0, peaks: null });
  showBody(); $("rpBody").style.display = ""; $("rpOk").disabled = true; layout(); wvMsg(t("decoding"));
  try {
    const buf = await f.arrayBuffer(), tg = id3(buf), a = await decode(buf);
    wvMsg(t("uploading"));
    const res = await api("/api/song/upload?name=" + encodeURIComponent(f.name), toPcm(a).buffer, true);
    if (!rp.open) return;
    rp.id = res.id; rp.audio = res.audio; rp.dur = a.duration;
    peaksFrom(a);
    rp.drop = guessDrop(a); rp.outro = Math.max(0, rp.dur - rp.cDur);
    if (!rp.song) { const [ar, ti] = tg.title ? [tg.artist || "", tg.title] : parseName(f.name); if (!$("rpArtist").value) $("rpArtist").value = ar; if (!$("rpTitle").value) $("rpTitle").value = ti; }
    wvMsg(""); showBody(); layout(); drawCover();
  } catch (e) {
    rp.audio = null; showBody(); wvMsg("");
    if (e && e.key) await showError(e); else note(esc(t("badFile")) + ": " + esc(f.name));
  }
}

// теги ID3v2 (mp3): исполнитель TPE1 и название TIT2 — до декодирования (decodeAudioData забирает буфер)
function id3(buf) {
  const b = new Uint8Array(buf), out = {};
  if (b.length < 10 || b[0] !== 0x49 || b[1] !== 0x44 || b[2] !== 0x33 || b[3] < 3) return out;
  const v = b[3], syn = i => (b[i] & 127) << 21 | (b[i + 1] & 127) << 14 | (b[i + 2] & 127) << 7 | (b[i + 3] & 127);
  const be = i => (b[i] << 24 | b[i + 1] << 16 | b[i + 2] << 8 | b[i + 3]) >>> 0;
  let p = 10; const end = Math.min(b.length, 10 + syn(6));
  if (b[5] & 0x40) p += v === 4 ? syn(10) : be(10) + 4;
  while (p + 10 <= end) {
    const id = String.fromCharCode(b[p], b[p + 1], b[p + 2], b[p + 3]); if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const n = v === 4 ? syn(p + 4) : be(p + 4); if (!n || p + 10 + n > end) break;
    if (id === "TIT2" || id === "TPE1") {
      const enc = b[p + 10], d = b.subarray(p + 11, p + 10 + n);
      try { out[id === "TIT2" ? "title" : "artist"] = new TextDecoder(["latin1", "utf-16", "utf-16be", "utf-8"][enc] || "utf-8").decode(d).split("\0")[0].trim(); } catch (e) {}
    }
    p += 10 + n;
  }
  return out;
}

// PCM 16 бит стерео, чередование L R — так песню принимает программа
function toPcm(a) {
  const L = a.getChannelData(0), R = a.numberOfChannels > 1 ? a.getChannelData(1) : L, n = L.length, pcm = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) {
    let l = L[i], r = R[i]; l = l < -1 ? -1 : l > 1 ? 1 : l; r = r < -1 ? -1 : r > 1 ? 1 : r;
    pcm[2 * i] = l < 0 ? l * 32768 : l * 32767; pcm[2 * i + 1] = r < 0 ? r * 32768 : r * 32767;
  }
  return pcm;
}

function peaksFrom(a) {
  const N = 1600, d0 = a.getChannelData(0), d1 = a.numberOfChannels > 1 ? a.getChannelData(1) : d0;
  const step = Math.max(1, Math.floor(d0.length / N)), pk = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    let m = 0; const e = Math.min(d0.length, (i + 1) * step);
    for (let j = i * step; j < e; j += 8) { const v = Math.abs(d0[j]) + Math.abs(d1[j]); if (v > m) m = v; }
    pk[i] = m / 2;
  }
  rp.peaks = pk;
}

// где «дроп» (GO на старте гонки) — Ваня 12.11: «переделай дроп всем… делать на GO».
// Дроп = момент, когда бас / бочка выходят на полную громкость песни после более тихого куска (заход бита, дроп после билда).
// 1) низы (до ~150 Гц: два однополюсных фильтра) — громкость каждые 10 мс;
// 2) скачок низов «4 с после против 4 с до», после него песня должна звучать почти на полную (>= 60 % громких мест песни);
// 3) берем ПЕРВЫЙ скачок, где низы выросли хотя бы вдвое (первые 2,5 минуты) — первый дроп / заход бита, а не дроп после брейкдауна
//    в середине песни; тихий интро-бит (< 60 % громкости) не в счет (Bass Inside: интро 13 с, дроп 61 с). Двойного нет — самый сильный скачок;
// 4) точное время — самый резкий удар низов (шаг 10 мс) в ±0,6 с от скачка.
// Раньше 20 с — можно: сборка ставит перед песней тишину, дроп все равно падает ровно на GO. Ничего не нашли — старый расчет (громкость, шаг 0,5 с).
function guessDrop(a) {
  const sr = a.sampleRate, L = a.getChannelData(0), R = a.numberOfChannels > 1 ? a.getChannelData(1) : L;
  const hop = Math.round(sr / 100), nf = Math.floor(L.length / hop), low = new Float32Array(nf);
  const k = 1 - Math.exp(-2 * Math.PI * 150 / sr);
  let y1 = 0, y2 = 0;
  for (let f = 0; f < nf; f++) {
    let s = 0;
    for (let j = f * hop, e = j + hop; j < e; j++) { y1 += k * ((L[j] + R[j]) * 0.5 - y1); y2 += k * (y1 - y2); s += y2 * y2; }
    low[f] = Math.sqrt(s / hop);
  }
  const G = 5, ng = Math.floor(nf / G), lg = new Float32Array(ng);   // кадры по 50 мс
  for (let i = 0; i < ng; i++) { let s = 0; for (let j = 0; j < G; j++) s += low[i * G + j]; lg[i] = s / G; }
  const loud = Float32Array.from(lg).sort()[Math.floor(ng * 0.8)] || 1e-6;   // «громко для этой песни»
  const W = 80, cl = new Float64Array(ng + 1);                                  // окно 4 с
  for (let i = 0; i < ng; i++) cl[i + 1] = cl[i] + lg[i];
  const t1 = Math.min(ng - W, Math.round(Math.min(150, a.duration - 20) / 0.05)), sc = new Float32Array(ng), pa = new Float32Array(ng);
  let best = 0;
  for (let i = Math.max(W, 60); i < t1; i++) {                                  // не раньше 3 с от начала (и 4 с окна)
    const pre = (cl[i] - cl[i - W]) / W, post = (cl[i + W] - cl[i]) / W;
    pa[i] = post;
    if (post < 0.6 * loud || post <= pre) continue;
    sc[i] = Math.log((post + 1e-4) / (pre + 1e-4));
    if (sc[i] > best) best = sc[i];
  }
  if (best < 0.35) return guessDropRms(a);                                     // скачка нет (ровная песня) — как раньше
  const top = i => { for (let j = Math.max(0, i - 40); j <= Math.min(ng - 1, i + 40); j++) if (sc[j] > sc[i]) return false; return true; };   // местный максимум ±2 с
  let c = -1;
  for (let i = 1; i < ng - 1 && c < 0; i++) if (sc[i] >= Math.LN2 && top(i)) c = i;   // первый: низы выросли >= 2 раз
  if (c < 0) for (let i = 1; i < ng - 1 && c < 0; i++) if (sc[i] >= best && sc[i] > 0) c = i;   // иначе самый сильный
  if (c < 0) return guessDropRms(a);
  // EDM: первое место бывает куплетом с басом на ~70 %, а главный дроп — через 20–40 с (Bring The Madness: 19 → 58 с, Recess: 46 → 56 с).
  // Есть в ближайшие 45 с дроп заметно мощнее (бас >= 1,2 раза громче и скачок >= 1,6 раза) — берем его (первый такой).
  // громкость после первого места — по самым громким 4 с в первые 1,5 с после него (кандидат стоит чуть раньше удара, сразу после — занижено)
  let pc = 0; for (let j = c; j < Math.min(t1, c + 30); j++) pc = Math.max(pc, pa[j]);
  // главный дроп — почти на полную (>= 85 % громких мест песни): у хип-хопа «бит плотнее во втором куплете» не в счет (AIN'T SHIT CHANGE 23,59, не 44,75)
  for (let i = c + 41; i < Math.min(t1, c + 900); i++)
    if (sc[i] >= Math.log(1.6) && pa[i] >= 1.2 * pc && pa[i] >= 0.85 * loud && top(i)) { c = i; break; }
  // точное время: окно 4 с ставит кандидата раньше удара (Mount Sinai 43,16 вместо 43,67, Jungle — на 1,1 с). В ±1,5 с ищем место, где сразу и резкий
  // удар низов (30 мс после против 30 мс до), и устойчивая ступенька (1 с после против 1 с до) — произведение. Сбивка перед дропом: удар без ступеньки;
  // нарастание: ступенька без удара. Сверено 12.11 с ручными GO Вани: AIN'T SHIT CHANGE (23,53), Edge of the Earth (9,47).
  // Из сильных (>= половины лучшего) — самое раннее: первый удар дропа, а не место, где бит уже заполнился (AIN'T SHIT CHANGE: 23,59, а не 24,9).
  const m = (f, n) => { let s = 0; for (let j = 0; j < n; j++) s += low[f + j]; return s / n; };
  const f0 = Math.max(100, c * G - 150), f1 = Math.min(nf - 100, c * G + 150), pd = new Float64Array(Math.max(0, f1 - f0));
  let bd = 0;
  for (let f = f0; f < f1; f++) { pd[f - f0] = Math.max(0, m(f, 3) - m(f - 3, 3)) * Math.max(0, m(f, 100) - m(f - 100, 100)); if (pd[f - f0] > bd) bd = pd[f - f0]; }
  if (bd <= 0) return c * G / 100;
  for (let f = f0; f < f1; f++) {
    const d = pd[f - f0];   // первое сильное место — и его вершина (удар длится 30–60 мс)
    if (d >= 0.5 * bd) { let g = f; while (g + 1 < f1 && pd[g + 1 - f0] > pd[g - f0]) g++; return g / 100; }
  }
  return c * G / 100;
}
// старый расчет (до 12.11): самый большой скачок громкости (6 с после против 6 с до) в первые 2 минуты, шаг 0,5 с; раньше 20 с — штраф
function guessDropRms(a) {
  const d = a.getChannelData(0), hop = Math.floor(a.sampleRate / 2), n = Math.floor(d.length / hop), r = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let j = i * hop; j < (i + 1) * hop; j += 4) s += d[j] * d[j]; r[i] = Math.sqrt(s / (hop / 4)); }
  const W = 12; let best = Math.min(B_INTRO, a.duration / 3), bs = 0;
  for (let i = W; i < Math.min(n - W, 240); i++) {
    let pre = 0, post = 0; for (let k = 0; k < W; k++) { pre += r[i - W + k]; post += r[i + k]; }
    const sc = post / (pre + 1e-3) * (i / 2 >= B_INTRO ? 1 : 0.8);
    if (sc > bs) { bs = sc; best = i / 2; }
  }
  return best;
}

function drawWave() {
  const c = $("wc"), dpr = devicePixelRatio || 1, w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr);
  if (!w) return;
  c.width = w; c.height = h; const g = c.getContext("2d"); g.clearRect(0, 0, w, h);
  if (!rp.peaks) return;
  g.fillStyle = "rgba(244,244,240,.6)";
  const N = rp.peaks.length, bw = Math.max(1, Math.round(2 * dpr)), st = bw + Math.round(dpr);
  for (let x = 0; x < w; x += st) {
    let m = 0; const i1 = Math.floor(x / w * N), i2 = Math.min(N, Math.floor((x + st) / w * N) + 1);
    for (let k = i1; k < i2; k++) m = Math.max(m, rp.peaks[k]);
    const bh = Math.max(dpr, m * h * .92); g.fillRect(x, (h - bh) / 2, bw, bh);
  }
}

function layout() {
  const ready = rp.dur > 0 && !!rp.peaks;
  $("wvGo").style.display = $("wvB").style.display = $("wvN").style.display = $("wvC").style.display = ready ? "" : "none";
  if (!rp.dur) { drawWave(); return; }
  const p = s => (100 * Math.max(0, Math.min(rp.dur, s)) / rp.dur) + "%";
  const b0 = Math.max(0, rp.drop - B_INTRO), cd = Math.min(rp.cDur, rp.dur);
  $("wvGo").style.left = p(rp.drop);
  const n0 = Math.max(0, rp.drop - B_COUNT);   // начало отсчета
  $("wvB").style.left = p(b0); $("wvB").style.width = (100 * Math.max(0, n0 - b0) / rp.dur) + "%";
  $("wvN").style.left = p(n0); $("wvN").style.width = (100 * (rp.drop - n0) / rp.dur) + "%";
  $("wvC").style.left = p(rp.outro); $("wvC").style.width = (100 * cd / rp.dur) + "%";
  $("tA").textContent = fmt(rp.dur);
  $("tB").textContent = (rp.drop < B_INTRO ? t("bPad", { s: (B_INTRO - rp.drop).toFixed(1) }) : "") + `${fmt(b0)} → ${fmt(rp.dur)}`;   // GO раньше 20 с — тишина перед песней
  $("tC").textContent = `${fmt(rp.outro)} – ${fmt(rp.outro + cd)}`;
  drawWave();
}

// мышь по волне: тянуть GO, тянуть желтый блок, клик — слушать с этого места
let drag = null;
const waveSec = e => { const r = $("wave").getBoundingClientRect(); return [(e.clientX - r.left) / r.width * rp.dur, rp.dur / r.width]; };
$("wave").addEventListener("mousedown", e => {
  if (!rp.dur || !rp.audio) return;
  const [s, px] = waveSec(e);
  if (Math.abs(s - rp.drop) < 10 * px) drag = { k: "go" };
  else if (s >= rp.outro && s <= rp.outro + rp.cDur) drag = { k: "c", off: s - rp.outro };
  else { pplay("A", s); return; }
  document.body.classList.add("wv-drag");
  e.preventDefault();
});
addEventListener("mousemove", e => {
  if (!drag) return;
  const [s] = waveSec(e);
  if (drag.k === "go") rp.drop = Math.max(0, Math.min(rp.dur - 5, s));
  else rp.outro = Math.max(0, Math.min(rp.dur - Math.min(rp.cDur, rp.dur), s - drag.off));
  layout();
});
addEventListener("mouseup", () => {
  if (!drag) return;
  const d = drag; drag = null; document.body.classList.remove("wv-drag");
  if (d.k === "go") pplay("B", Math.max(0, rp.drop - 4)); // сразу слышно 3-2-1-GO
  else pplay("C");
});

// прослушка кусков
const au2 = $("au2"); let pp = null;
function pplay(mode, from) {
  if (pp && pp.mode === mode && from === undefined) { stopPanel(); return; }
  const src = rp.audio; if (!src) return;
  let start = 0, end = null;
  if (mode === "A") start = from || 0;
  if (mode === "B") start = from ?? Math.max(0, rp.drop - B_INTRO);
  if (mode === "C") { start = rp.outro; end = rp.outro + Math.min(rp.cDur, rp.dur); }
  // GO раньше B_INTRO (20,45 с): в игре старт начинается с тишины (сборка ставит ее перед песней, дроп ровно на GO) — так и слушаем
  const wait = mode === "B" && from === undefined ? Math.max(0, B_INTRO - rp.drop) : 0;
  pp = { mode, end };
  const go = () => { if (!pp || pp.mode !== mode) return; au2.currentTime = start; au2.volume = 1; au2.play().catch(() => {}); };
  const launch = () => {
    if (!pp || pp.mode !== mode) return;

function drawCover() { paintCover($("covC"), rp.covMode === "img" ? rp.img : null, $("rpTitle").value, $("rpArtist").value, rp.covMode === "none"); }
function paintCover(c, img, ttl, art, empty) {

  } else {
    g.fillStyle = "#141518"; g.fillRect(0, 0, W, W);
    let seed = 7; for (const ch of (ttl + art)) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
    const R = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(255,255,255,${0.03 + R() * 0.06})`; g.fillRect(R() * W, R() * W, 1, 1); }
    if (empty) return;   // «Удалить»: пустая темная обложка
    g.save(); g.translate(W / 2, W / 2); g.rotate(-0.22);
    g.fillStyle = "#b6ff1a"; g.fillRect(-W, -22, W * 2, 44);
    g.fillStyle = "#ffe600"; g.fillRect(-W, 26, W * 2, 6);
    g.restore();
    for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(88,255,60,${0.2 + R() * 0.5})`; g.fillRect(W - 40 + R() * R() * 40, R() * W, 1, 2 + R() * 10); }
    const title = (ttl || "MY SONG").toUpperCase(), artist = (art || "").toUpperCase();
    g.fillStyle = "#f4f4f0"; g.textBaseline = "top";
    let size = 40, lines;
    const wrap = (txt, sz) => { g.font = `700 ${sz}px Bahnschrift, "Arial Narrow", sans-serif`; const words = txt.split(/\s+/), out = []; let cur = "";
      for (const w of words) { const tst = cur ? cur + " " + w : w; if (g.measureText(tst).width > W - 36 && cur) { out.push(cur); cur = w; } else cur = tst; } if (cur) out.push(cur); return out; };
    do { lines = wrap(title, size); size -= 2; } while ((lines.length * size > 110 || lines.some(l => g.measureText(l).width > W - 36)) && size > 14);
    lines.slice(0, 4).forEach((l, i) => g.fillText(l, 18, 18 + i * (size + 4)));
    g.fillStyle = "#8a8a85"; g.font = `600 15px Bahnschrift, "Arial Narrow", sans-serif`;
    g.fillText(artist.slice(0, 32), 18, W - 32);
  }
}

// Ваня 12.11: «зашел как пользователь и думать не хочу» -> сначала выбор: одна песня / плейлист-альбом / много ссылок / список из .txt.

const YT_RE = /https?:\/\/[^\s;,"'<>]+/gi;
const isYt = u => /^https?:\/\/([a-z0-9-]+\.)*(youtube\.com|youtu\.be)\//i.test(u || "");

function ytKey(u) {   // одна песня / плейлист под разными ссылками (music. / www. / youtu.be, &list=, &t=, &si=) — один ключ
  try {
    const x = new URL(u), p = x.pathname;
    if (p.toLowerCase().startsWith("/browse/")) return "b:" + p.slice(8);
    if (p.toLowerCase().startsWith("/playlist")) return "l:" + x.searchParams.get("list");
    if (x.searchParams.get("v")) return "v:" + x.searchParams.get("v");
    if (/(^|\.)youtu\.be$/i.test(x.hostname)) return "v:" + p.slice(1);

}
const ytVid = u => { const k = ytKey(u); return k.startsWith("v:") ? k.slice(2) : ""; };

const ytLen = s => { const r = Math.round(s || 0); return r > 0 ? Math.floor(r / 60) + ":" + String(r % 60).padStart(2, "0") : ""; };
function ytParse(text) {   // текст (вставка / .txt) -> {rows: [{url, title, artist}], skip: кусков без ссылки YouTube}
  const rows = []; let skip = 0;
  const cyr = s => /[Ѐ-ӿ�]/.test(s);   // кириллица / битые знаки (не та кодировка) — поле не берем, имя с YouTube
  for (let rec of String(text || "").replace(/^﻿/, "").split(/[;\r\n]+/)) {
    rec = rec.trim();
    if (!rec || rec.startsWith("#") || rec.startsWith("//")) continue;   // пусто / комментарий
    const links = (rec.match(YT_RE) || []).map(u => u.replace(/[).]+$/, "")).filter(isYt);
    if (!links.length) { skip++; continue; }                               // заголовок, текст, чужая ссылка
    if (links.length > 1) { links.forEach(url => rows.push({ url, title: "", artist: "" })); continue; }   // несколько ссылок подряд — без имен
    const f = rec.replace(YT_RE, "").split(/[,\t]/).map(s => s.replace(/"/g, "").trim()).filter(Boolean);
    let title = f[0] || "", artist = f.slice(1).join(", ");                // исполнитель с запятыми («Skrillex, Fred again..») — все поля после названия
    if (f.length === 1) { const m = title.match(/^(.+?)\s+[-–—]\s+(.+)$/); if (m) { artist = m[1].trim(); title = m[2].trim(); } }
    if (cyr(title)) title = ""; if (cyr(artist)) artist = "";
    rows.push({ url: links[0], title, artist });
  }
  return { rows, skip };
}
async function readTxt(f) {   // .txt из Блокнота: UTF-8, UTF-16 (с BOM) или старая латинская кодировка Windows (польская — 1250)
  const b = new Uint8Array(await f.arrayBuffer());
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder("utf-16le").decode(b);
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder("utf-16be").decode(b);
  try { return new TextDecoder("utf-8", { fatal: true }).decode(b); }
  catch (e) { return new TextDecoder(LANG === "pl" ? "windows-1250" : "windows-1252").decode(b); }
}

    if (countSkip) skip += p.skip;
    const fresh = [];
    for (const x of p.rows) { x.k = ytKey(x.url); if (seen.has(x.k)) { dup++; continue; } seen.add(x.k); x.pl = isYtList(x.url); L.push(x); fresh.push(x); }
    const singles = fresh.filter(x => !x.pl);   // одиночные: «уже есть?» одним запросом (id ролика / исполнитель|название) + что по ссылке
    if (singles.length) haveQ = haveQ.then(() => api("/api/yt/have", { items: singles.map(x => ({ url: x.url, artist: x.artist, title: x.title })) })
      .then(r => { singles.forEach((x, i) => x.have = !!(r.have && r.have[i])); if (r.free >= 0) free = r.free; draw(); }, () => {}));
    if (box) { infoQ.push(...singles); peekNext(); }
    for (const x of fresh.filter(x => x.pl))   // плейлисты — по одному: программа держит один запрос yt-dlp разом
      readQ = readQ.then(() => alive && !x.gone ? api("/api/yt/list", { url: x.url })
        .then(r => { if (r.playlist) { x.r = r; if (r.free >= 0) free = r.free; } else x.pl = false; }, e => { x.err = errText(e); }).then(draw) : null);
    draw();
    if (box && fresh.length) { const l = box.querySelector("[data-list]"); l.scrollTop = l.scrollHeight; }
  };
  const say = text => { const st = box.querySelector("[data-st]"); st.textContent = text; st.className = "fp-st no"; };
  // одна песня / плейлист: одно поле, Enter или «Завантажити». Что вставили — то и делаем по самой ссылке (плейлист в поле «песня» — тоже ок)
  const askOne = pl => askYesNo({ title: pl ? t("ytListT") : t("ytSongT"), yes: t("ytGo"), no: t("cancel"),
    html: `<p>${pl ? t("ytPlHtml") : t("ytSongHtml")}</p><div class="fp-path"><input data-in spellcheck="false" placeholder="${pl ? "https://music.youtube.com/playlist?list=…" : "https://music.youtube.com/watch?v=…"}"></div><div class="fp-st" data-st></div>`,
    onOpen: (b, done) => {
      inp = b.querySelector("[data-in]");
      inp.onkeydown = e => {
        if (e.key !== "Enter") return; e.preventDefault();
        if (ytParse(inp.value).rows.length) done(true);
        else if (inp.value.trim()) { const st = b.querySelector("[data-st]"); st.textContent = errText({ key: "ytLink" }); st.className = "fp-st no"; }
      };
      setTimeout(() => inp.focus(), 80);
    } });
  const ok = mode !== "list" ? await askOne(mode === "pl") : await askYesNo({ title: fromTxt ? t("ytM4") : t("ytM3"), yes: t("ytGo"), no: t("cancel"), tall: true,
    html: `<p>${t("ytHtml")}</p>`
      + `<div class="fp-path"><input data-in spellcheck="false" placeholder="https://music.youtube.com/watch?v=…"><button data-add>${t("ytAddBtn")}</button></div>`
      + `<div class="yt-list" data-list></div><div class="fp-st" data-st></div>`,
    onOpen: (b, done) => {
      box = b; inp = b.querySelector("[data-in]"); lbl = b.parentElement.querySelector(".dlg-btn .lbl");
      const add = () => { const v = inp.value.trim(); if (!v) return; const p = ytParse(v); if (!p.rows.length) say(errText({ key: "ytLink" })); else { addRows(p, false); inp.value = ""; } inp.focus(); };
      inp.onkeydown = e => { if (e.key !== "Enter") return; e.preventDefault(); if (inp.value.trim()) add(); else if (L.length) done(true); };
      inp.addEventListener("paste", e => {   // вставили ссылку / пачку — сразу в список (с тем, что уже набрано в поле: «Назва,Виконавець,»)
        const s = e.clipboardData.getData("text") || "";
        if (!(s.match(YT_RE) || []).some(isYt)) return;
        e.preventDefault();
        addRows(ytParse(inp.value.slice(0, inp.selectionStart) + s + inp.value.slice(inp.selectionEnd)), /[\n;]/.test(s.trim()));
        inp.value = "";
      });
      b.querySelector("[data-add]").onclick = add;
      b.querySelector("[data-list]").onclick = e => {
        const d = e.target.closest("[data-del]"); if (!d) return;
        const i = L.findIndex(y => y.k === d.dataset.del); if (i < 0) return;
        const x = L.splice(i, 1)[0]; x.gone = true; seen.delete(x.k); if (x.el) x.el.remove();
        draw(); inp.focus();
      };
      const back = b.closest(".dlg-back");   // ссылку из браузера / .txt мышкой — на окно
      back.addEventListener("dragover", e => e.preventDefault());
      back.addEventListener("drop", async e => {
        e.preventDefault(); e.stopPropagation();
        const f = [...(e.dataTransfer.files || [])].find(y => /\.(txt|csv|tsv)$/i.test(y.name));
        if (f) addRows(ytParse(await readTxt(f)), true);
        else addRows(ytParse(e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain") || ""), false);
        inp.focus();
      });
      if (pre) addRows(ytParse(pre), true);
      draw(); setTimeout(() => inp.focus(), 80);
    } });
  if (!ok) { alive = false; return; }
  if (inp.value.trim()) addRows(ytParse(inp.value), false);   // вставили руками и сразу нажали «Завантажити»
  if (!L.length) { if (inp.value.trim()) await showError({ key: "ytLink" }); return; }
  alive = false;   // что по ссылке — больше не спрашиваем (качаем)
  if (L.some(x => x.pl && !x.r && !x.err)) { alive = true; showBusy(t("ytT"), t("ytRead")); await readQ; hideBusy(); alive = false; }
  await haveQ;
  const { todo, total, have } = plan(), bad = L.filter(x => x.err);
  const badHtml = bad.map(x => `<br><span class="warn">✕ ${esc(ytShort(x.url))}: ${esc(x.err)}</span>`).join("");
  if (!todo.length) {
    const msg = total ? (L.length === 1 && L[0].pl ? t("ytAllHave", { n: total }) : t("ytNothing")) : "";
    await askYesNo({ title: bad.length && !total ? t("ytFailT") : t("ytT"), html: `<p>${msg}${badHtml}</p>`, yes: t("close"), no: null });
    return;
  }
  if (L.length === 1 && !L[0].pl) {   // одна песня — как раньше: сразу качаем, без окна веса
    const x = todo[0];
    showBusy(t("ytT"), t("ytBusy"));
    try { await api("/api/yt", { url: x.url, artist: x.artist, title: x.title, dur: x.dur, names: x.names }); hideBusy(); }
    catch (e) { hideBusy(); await showError(e); return; }
    await syncMusic();
    return;
  }
  const one = L.length === 1 && L[0].pl;
  const head = (one ? `<b>${esc(L[0].r.title)}</b> — ${t("ytListN", { n: total })}` : t("ytMixN", { k: L.length, n: total })) + (have ? " " + t("ytHave", { k: have }) : "") + badHtml;
  await ytRun(todo, one ? t("ytListT") : t("ytT"), head, free);
}
// список песен (плейлист / пачка ссылок): окно веса и времени, потом по одной (прогресс, «Стоп» — после текущей); потом обычный импорт Music
async function ytRun(todo, title, head, free) {
  const min = Math.max(1, Math.round(todo.length * 6 / 60));
  // вес — замер 11.11 на 79 песнях: скачанное (m4a) 16,6 КБ на секунду звука, данные программы (wav + куски EA) 231 КБ/с, мод 39 КБ/с
  const secs = todo.reduce((a, x) => a + (x.dur > 0 ? x.dur : 200), 0), dl = secs * 16.6e3 + todo.length * 40e3, disk = secs * (16.6e3 + 231e3), mod = secs * 39e3;
  const fmt = b => (b >= 1e9 ? (b / 1e9).toFixed(1) + " " + t("uGB") : Math.max(1, Math.round(b / 1e6)) + " " + t("uMB")).replace(".", ["en", "zh", "ja", "ko"].includes(LANG) ? "." : ",");   // 1.5 GB — en/zh/ja/ko, 1,5 — остальные
  const full = free >= 0 && disk + mod > free;
  if (!await askYesNo({ title, yes: t("ytListGo", { n: todo.length }), no: t("cancel"),
    html: `<p>${head}</p><p>${t("ytListHtml", { min, mine: t("secMine") })}</p>`
      + `<p>${t("ytSize", { dl: fmt(dl), disk: fmt(disk), mod: fmt(mod), free: free >= 0 ? fmt(free) : "?" })}${full ? ` <b style="color:#ff3b3b">${t("ytNoSpace")}</b>` : ""}</p>`
      + `<p><small>${t("ytLag")}</small></p>` })) return;
  let stop = false, ok = 0, alt = 0, miss = 0; const bad = [];
  showBusy(title, "", { label: t("ytStop"), fn: () => { stop = true; updateBusy(t("ytStopping")); } });
  for (let i = 0; i < todo.length && !stop; i++) {
    const x = todo[i], nm = x.title ? (x.artist ? x.artist + " — " : "") + x.title : ytShort(x.url);   // без имени (ссылка из списка) — сама ссылка
    updateBusy(t("ytStep", { n: i + 1, m: todo.length, a: nm }), 100 * i / todo.length);
    // недоступный ролик программа сама меняет на ту же песню с YT Music (название + длина), alt — сколько таких; names — имена из списка человека
    try {
      const res = await api("/api/yt", { url: x.url, artist: x.artist, title: x.title, dur: x.dur, names: !!x.names }); ok++; miss = 0;
      if (res && res.alt) { alt++; busyLog("↻ " + (res.name || nm) + " — " + t("ytAltLine"), "warn"); }
      if (res && res.retried) busyLog("⟳ " + (res.name || nm) + " — " + t("ytRetryLine"), "warn");
    } catch (e) {   // ошибка — сразу строкой под полосой (Ваня: «чтоб юзеру было понятно»), итог — списком в конце
      const m = nm + ": " + errText(e); bad.push(m); busyLog("✕ " + m, "err");
      if (e.key === "net" || (e.key !== "ytGone" && ++miss >= 5)) break;   // 5 сбоев подряд — YouTube уперся, дальше без толку
    }
  }
  hideBusy();
  await syncMusic();
  const sum = t("ytDone", { ok, n: todo.length }) + (alt ? " " + t("ytAlt", { k: alt }) : "");
  if (bad.length) {
    const v = await askYesNo({ title: t("ytFailT"), html: `<p>${sum}</p><ul>${bad.map(b => `<li>${esc(b)}</li>`).join("")}</ul>`, yes: t("close"), no: t("openLog"), tall: bad.length > 6 });
    if (v === false) api("/api/open", { what: "log" }).catch(() => {});
  } else if (stop || alt) note(sum);
}

// ---------- сохранить / удалить ----------
$("rpOk").onclick = async () => {
  if (!rp.audio || !rp.id) return;
  stopPanel();
  $("rpOk").disabled = true;
  try {
    drawCover();
    if (!rp.song || rp.imgChanged || !rp.song.cover || !rp.img) {
      const blob = await new Promise(r => $("covC").toBlob(r, "image/png"));
      await api("/api/song/cover?id=" + encodeURIComponent(rp.id) + (rp.song ? "&tofolder=1" : ""), blob, true);
    }
    await api("/api/song/save", { id: rp.id, title: $("rpTitle").value, artist: $("rpArtist").value, drop: +rp.drop.toFixed(2), outro: +rp.outro.toFixed(2), cDur: rp.cDur, race: rp.race, city: rp.city });
    if (!rp.song && rp.fileObj) await api("/api/music/put?id=" + encodeURIComponent(rp.id) + "&name=" + encodeURIComponent(rp.fileObj.name), rp.fileObj, true).catch(e => note(esc(errText(e))));
    S = await api("/api/state"); songs = S.songs;
    closeSong(); render(); stats();
    note(t("savedNote"));
  } catch (e) { await showError(e); }
  $("rpOk").disabled = !rp.audio;
};
$("rpDel").onclick = async () => {
  const s = rp.song; if (!s) return;
  if (!await askYesNo({ title: t("delT"), html: t("delHtml", { t: esc(s.title) }) + (s.src ? t("delMusic") : ""), yes: t("yes"), no: t("no") })) return;
  try { await api("/api/song/delete", { id: s.id }); songs = songs.filter(x => x.id !== s.id); closeSong(); render(); stats(); } catch (e) { await showError(e); }
};

$("rpPick").onclick = e => { e.preventDefault(); $("songFile").click(); };
$("rpDrop").onclick = e => { if (!rp.audio) { e.preventDefault(); $("songFile").click(); } };
$("songFile").onchange = e => { const f = e.target.files[0]; if (f) { if (!rp.open) openSong(null, f); else takeFile(f); } e.target.value = ""; };
$("rpX").onclick = tryCloseSong; $("rpDim").onclick = tryCloseSong;

// файлы мышкой: на «Добавить песню» — новая песня; в панель — взять файл (картинка — в обложку)
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); if (!e._done) dropAny(e); });   // файлы / ссылку бросили мимо карточек — dropAny
$("grid").addEventListener("dragover", e => { const c = e.target.closest(".card.add"); document.querySelectorAll(".card.add").forEach(x => x.classList.toggle("dragto", x === c)); });
$("grid").addEventListener("drop", e => {
  document.querySelectorAll(".card.dragto").forEach(x => x.classList.remove("dragto"));
  if (e.target.closest("#ytCard") && !e.dataTransfer.files.length) { const u = e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain") || ""; if (u) { e._done = true; ytAsk(u); return; } }   // ссылку перетащили из браузера — окно со ссылкой в списке
  const f = e.dataTransfer.files[0]; if (!f || /\.(txt|csv|tsv)$/i.test(f.name)) return;   // .txt со ссылками — dropAny (окно YouTube)
  if (e.target.closest(".card.add")) { e._done = true; openSong(null, f); }
});
$("rpan").addEventListener("dragover", () => { if (!rp.audio) $("rpDrop").classList.add("over"); });
$("rpan").addEventListener("dragleave", e => { if (!$("rpan").contains(e.relatedTarget)) $("rpDrop").classList.remove("over"); });
$("rpan").addEventListener("drop", e => { e._done = true;
  $("rpDrop").classList.remove("over"); const f = e.dataTransfer.files[0]; if (!f || !rp.open) return;
  if ((f.type || "").startsWith("image/")) takeImage(f); else if (!rp.audio) takeFile(f);
});
addEventListener("resize", () => { if (rp.open) layout(); });

// Длинные слова (PL «Wszystkie utwory», PT «trilha sonora») не влезали в левую колонку — уменьшаем шрифт группы
function fitSide() {
  const side = document.querySelector(".side");
  if (!side.clientWidth) return;
  const room = side.clientWidth - parseFloat(getComputedStyle(side).paddingLeft) - 20;
  const shrink = (els, base, width) => { let s = base; const set = () => els.forEach(e => e.style.fontSize = s + "px"); set(); while (s > 14 && els.some(e => width(e) > room)) { s--; set(); } };
  const title = document.querySelector(".title");
  shrink([title], 54, e => Math.max(...[...e.children].filter(c => c.tagName !== "BR").map(c => c.offsetWidth)));
  shrink([...document.querySelectorAll("#menu .item")], 30, e => { const badge = e.parentElement.querySelector(".new"); return e.offsetWidth + (badge ? badge.offsetWidth + 6 : 0); });
}
addEventListener("resize", fitSide);

// программа выключилась, а окно осталось — говорим прямо, а не показываем пустую сетку
let pingFails = 0;
setInterval(() => fetch("/api/ping").then(() => { if (pingFails >= 3) location.reload(); pingFails = 0; })
  .catch(() => { if (++pingFails === 3) showBusy(t("failT"), t("err_net")); }), 2000);
fetch("/api/ping").catch(() => {});
addEventListener("pagehide", () => navigator.sendBeacon("/api/bye", "{}"));
// окно программы, а не браузер: без меню правого клика (в полях ввода — оставляем, там вставка) и без DevTools по F12 / Ctrl+Shift+I/J/C / Ctrl+U.
// Код открыт (GPL v3, папка source) — это защита от случайного «колупания», не от чтения.
addEventListener("contextmenu", e => { if (!e.target.closest("input, textarea")) e.preventDefault(); }, true);
addEventListener("keydown", e => {
  const k = (e.key || "").toUpperCase();
  if (k === "F12" || (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(k)) || (e.ctrlKey && !e.shiftKey && k === "U")) { e.preventDefault(); e.stopPropagation(); }
}, true);
applyI18n("docTitle"); fitSide();
// язык хранит программа (data\settings.json): localStorage у окна каждый раз новый — порт другой
const relang = () => { applyI18n("docTitle"); fitSide(); relangDialogs(); if (S) { renderProfiles(); render(); } if (rp.open) { $("rpH").textContent = t(rp.song ? "panelEdit" : "panelNew"); showBody(); } };
const onLang = () => { relang(); api("/api/lang", { lang: LANG }).catch(() => {}); };
function setLang(c) {
  if (c !== LANG) { LANG = c; try { localStorage.setItem("lang", c); } catch (e) {} relang(); }
  langSwitcher($("lang"), onLang);
}
langSwitcher($("lang"), onLang);
boot();
